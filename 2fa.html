<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Authenticator Коды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .title {
            color: white;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .codes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .code-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .code-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .account-label {
            color: #667eea;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .code-display {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #333;
            font-family: 'Courier New', monospace;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .countdown {
            color: #999;
            font-size: 12px;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-copy-all {
            background: white;
            color: #667eea;
            flex: 1;
            min-width: 300px;
            font-size: 18px;
            padding: 16px 50px;
        }

        .btn-copy-all:hover {
            background: #f5f5f5;
            transform: scale(1.02);
        }

        .btn-copy-all:active {
            transform: scale(0.98);
        }

        .btn-setup {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-setup:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .close-btn {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            border: none;
            background: none;
        }

        .close-btn:hover {
            color: #000;
        }

        .setup-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .form-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background: #667eea;
            color: white;
        }

        .btn-save:hover {
            background: #5568d3;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .codes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .title {
                font-size: 24px;
            }

            .btn-copy-all {
                min-width: 200px;
            }
        }

        @media (max-width: 480px) {
            .codes-grid {
                grid-template-columns: 1fr;
            }

            .code-display {
                font-size: 28px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">2FA Коды</h1>
            <p class="subtitle">Ваши коды аутентификации</p>
        </div>

        <div class="codes-grid" id="codesGrid">
            <!-- Карточки будут сгенерированы JS -->
        </div>

        <div class="button-container">
            <button class="btn btn-copy-all" id="copyAllBtn">📋 Копировать все коды</button>
            <button class="btn btn-setup" id="setupBtn">⚙️ Настройка</button>
        </div>
    </div>

    <!-- Modal для настройки -->
    <div class="modal" id="setupModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <h2 class="modal-header">Настройка 2FA Аккаунтов</h2>
            <div class="success-message" id="successMessage">Сохранено успешно!</div>
            <div class="setup-form" id="setupForm">
                <!-- Поля будут сгенерированы JS -->
            </div>
            <div class="form-actions">
                <button class="form-actions button btn-save" id="saveBtn">Сохранить</button>
                <button class="form-actions button btn-cancel" id="cancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha1/0.6.0/sha1.min.js"></script>
    <script>
        const ACCOUNTS = 6;
        let authenticators = {};

        // TOTP функция - генерирует 6-значный код
        function generateTOTP(secret, time = null) {
            if (!secret) return '------';
            
            time = time || Math.floor(Date.now() / 1000);
            const epoch = Math.floor(time / 30);
            
            // Конвертируем base32 secret в байты
            const key = base32ToBytes(secret);
            
            // Создаем HMAC-SHA1
            const msg = new ArrayBuffer(8);
            const view = new Uint8Array(msg);
            for (let i = 7; i >= 0; i--) {
                view[i] = epoch & 0xff;
                epoch >>= 8;
            }
            
            const hmac = generateHMAC(key, view);
            
            // Динамическое усечение
            const offset = hmac[hmac.length - 1] & 0xf;
            const code = ((hmac[offset] & 0x7f) << 24)
                | ((hmac[offset + 1] & 0xff) << 16)
                | ((hmac[offset + 2] & 0xff) << 8)
                | (hmac[offset + 3] & 0xff);
            
            return (code % 1000000).toString().padStart(6, '0');
        }

        // Конвертируем base32 в байты
        function base32ToBytes(base32String) {
            const base32Alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            const bits = base32String
                .toUpperCase()
                .split('')
                .map(char => base32Alphabet.indexOf(char).toString(2).padStart(5, '0'))
                .join('')
                .padEnd(Math.ceil(base32String.length * 5 / 8) * 8, '0');
            
            const bytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                bytes.push(parseInt(bits.substr(i, 8), 2));
            }
            return bytes;
        }

        // HMAC-SHA1
        function generateHMAC(key, message) {
            const blockSize = 64;
            const hashSize = 20;
            
            if (key.length > blockSize) {
                key = sha1Bytes(key);
            }
            
            const paddedKey = new Array(blockSize);
            for (let i = 0; i < blockSize; i++) {
                paddedKey[i] = key[i] || 0;
            }
            
            const opad = new Array(blockSize);
            const ipad = new Array(blockSize);
            
            for (let i = 0; i < blockSize; i++) {
                opad[i] = paddedKey[i] ^ 0x5c;
                ipad[i] = paddedKey[i] ^ 0x36;
            }
            
            const innerMessage = new Uint8Array([...ipad, ...message]);
            const innerHash = sha1Bytes(innerMessage);
            
            const outerMessage = new Uint8Array([...opad, ...innerHash]);
            return sha1Bytes(outerMessage);
        }

        // SHA1 - используем встроенную функцию
        function sha1Bytes(data) {
            const hash = sha1(data);
            const result = [];
            for (let i = 0; i < hash.length; i += 2) {
                result.push(parseInt(hash.substr(i, 2), 16));
            }
            return result;
        }

        // Загружаем сохраненные данные
        function loadAuthenticators() {
            const saved = localStorage.getItem('authenticators');
            if (saved) {
                authenticators = JSON.parse(saved);
            } else {
                // Инициализируем пустые аккаунты
                for (let i = 1; i <= ACCOUNTS; i++) {
                    authenticators[i] = {
                        name: `Аккаунт ${i}`,
                        secret: ''
                    };
                }
            }
        }

        // Сохраняем данные
        function saveAuthenticators() {
            localStorage.setItem('authenticators', JSON.stringify(authenticators));
        }

        // Инициализируем сетку кодов
        function initializeGrid() {
            const grid = document.getElementById('codesGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= ACCOUNTS; i++) {
                const card = document.createElement('div');
                card.className = 'code-card';
                card.id = `card-${i}`;
                card.innerHTML = `
                    <div class="account-label">Аккаунт ${i}</div>
                    <div class="code-display" id="code-${i}">------</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-${i}" style="width: 100%"></div>
                    </div>
                    <div class="countdown" id="countdown-${i}">Обновление через 30с</div>
                `;
                grid.appendChild(card);
            }
        }

        // Обновляем все коды
        function updateCodes() {
            const now = Math.floor(Date.now() / 1000);
            const timeInPeriod = now % 30;
            const progress = ((30 - timeInPeriod) / 30) * 100;
            
            for (let i = 1; i <= ACCOUNTS; i++) {
                const secret = authenticators[i].secret;
                const code = generateTOTP(secret, now);
                
                document.getElementById(`code-${i}`).textContent = code;
                document.getElementById(`progress-${i}`).style.width = progress + '%';
                document.getElementById(`countdown-${i}`).textContent = `Обновление через ${30 - timeInPeriod}с`;
            }
        }

        // Инициализируем форму настройки
        function initializeSetupForm() {
            const form = document.getElementById('setupForm');
            form.innerHTML = '';
            
            for (let i = 1; i <= ACCOUNTS; i++) {
                const formGroup = document.createElement('div');
                formGroup.className = 'form-group';
                formGroup.innerHTML = `
                    <label for="account-${i}">Аккаунт ${i} - Secret Key (Base32)</label>
                    <input 
                        type="text" 
                        id="account-${i}" 
                        placeholder="Введите Base32 secret" 
                        value="${authenticators[i].secret || ''}"
                    >
                `;
                form.appendChild(formGroup);
            }
        }

        // Копируем все коды
        function copyAllCodes() {
            const codes = [];
            for (let i = 1; i <= ACCOUNTS; i++) {
                const code = document.getElementById(`code-${i}`).textContent;
                if (code !== '------') {
                    codes.push(`Аккаунт ${i}: ${code}`);
                }
            }
            
            const text = codes.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyAllBtn');
                const originalText = btn.textContent;
                btn.textContent = '✓ Скопировано!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Инициализируем модальное окно
        function setupModal() {
            const modal = document.getElementById('setupModal');
            const setupBtn = document.getElementById('setupBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const saveBtn = document.getElementById('saveBtn');

            setupBtn.addEventListener('click', () => {
                initializeSetupForm();
                modal.classList.add('active');
            });

            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            cancelBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            saveBtn.addEventListener('click', () => {
                for (let i = 1; i <= ACCOUNTS; i++) {
                    const secret = document.getElementById(`account-${i}`).value.trim().toUpperCase();
                    authenticators[i].secret = secret;
                }
                saveAuthenticators();
                
                const successMsg = document.getElementById('successMessage');
                successMsg.classList.add('show');
                setTimeout(() => {
                    successMsg.classList.remove('show');
                    modal.classList.remove('active');
                    updateCodes();
                }, 1500);
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }

        // Инициализация
        function init() {
            loadAuthenticators();
            initializeGrid();
            setupModal();
            updateCodes();

            document.getElementById('copyAllBtn').addEventListener('click', copyAllCodes);

            // Обновляем коды каждую секунду
            setInterval(updateCodes, 1000);
        }

        // Запускаем при загрузке страницы
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
