<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Authenticator Коды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .title {
            color: white;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .codes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .code-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.3),
                            0 0 40px rgba(255, 255, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 255, 255, 0.6),
                            0 0 60px rgba(255, 255, 255, 0.3);
            }
        }

        .code-card:hover {
            transform: translateY(-5px);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .account-label {
            color: #667eea;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .code-display {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #333;
            font-family: 'Courier New', monospace;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .countdown {
            color: #999;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .button-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-copy {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-copy:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        .btn-copy:active {
            transform: scale(0.95);
        }

        .bottom-cards-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .bottom-card {
            flex: 0 1 calc(50% - 10px);
            max-width: 300px;
        }

        @media (max-width: 768px) {
            .codes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .title {
                font-size: 24px;
            }

            .bottom-cards-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .bottom-card {
                flex: 1;
                max-width: 100%;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .codes-grid {
                grid-template-columns: 1fr;
            }

            .code-display {
                font-size: 28px;
                letter-spacing: 4px;
            }

            .bottom-cards-wrapper {
                flex-direction: column;
            }

            .bottom-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">2FA Коды</h1>
            <p class="subtitle">Ваши коды аутентификации</p>
        </div>

        <div class="codes-grid" id="codesGrid">
            <!-- Карточки будут сгенерированы JS -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha1/0.6.0/sha1.min.js"></script>
    <script>
        const ACCOUNTS = 6;
        
        // ===== ЗДЕСЬ ВСТАВЛЯЙТЕ СВОИ BASE32 КЛЮЧИ =====
        const SECRETS = {
            1: '', // Аккаунт 1 - вставьте Base32 ключ сюда
            2: '', // Аккаунт 2
            3: '', // Аккаунт 3
            4: '', // Аккаунт 4
            5: '', // Аккаунт 5
            6: ''  // Аккаунт 6
        };
        // ============================================

        // TOTP функция - генерирует 6-значный код
        function generateTOTP(secret, time = null) {
            if (!secret) return '------';
            
            time = time || Math.floor(Date.now() / 1000);
            const epoch = Math.floor(time / 30);
            
            // Конвертируем base32 secret в байты
            const key = base32ToBytes(secret);
            
            // Создаем HMAC-SHA1
            const msg = new ArrayBuffer(8);
            const view = new Uint8Array(msg);
            for (let i = 7; i >= 0; i--) {
                view[i] = epoch & 0xff;
                epoch >>= 8;
            }
            
            const hmac = generateHMAC(key, view);
            
            // Динамическое усечение
            const offset = hmac[hmac.length - 1] & 0xf;
            const code = ((hmac[offset] & 0x7f) << 24)
                | ((hmac[offset + 1] & 0xff) << 16)
                | ((hmac[offset + 2] & 0xff) << 8)
                | (hmac[offset + 3] & 0xff);
            
            return (code % 1000000).toString().padStart(6, '0');
        }

        // Конвертируем base32 в байты
        function base32ToBytes(base32String) {
            const base32Alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            const bits = base32String
                .toUpperCase()
                .split('')
                .map(char => base32Alphabet.indexOf(char).toString(2).padStart(5, '0'))
                .join('')
                .padEnd(Math.ceil(base32String.length * 5 / 8) * 8, '0');
            
            const bytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                bytes.push(parseInt(bits.substr(i, 8), 2));
            }
            return bytes;
        }

        // HMAC-SHA1
        function generateHMAC(key, message) {
            const blockSize = 64;
            
            if (key.length > blockSize) {
                key = sha1Bytes(key);
            }
            
            const paddedKey = new Array(blockSize);
            for (let i = 0; i < blockSize; i++) {
                paddedKey[i] = key[i] || 0;
            }
            
            const opad = new Array(blockSize);
            const ipad = new Array(blockSize);
            
            for (let i = 0; i < blockSize; i++) {
                opad[i] = paddedKey[i] ^ 0x5c;
                ipad[i] = paddedKey[i] ^ 0x36;
            }
            
            const innerMessage = new Uint8Array([...ipad, ...message]);
            const innerHash = sha1Bytes(innerMessage);
            
            const outerMessage = new Uint8Array([...opad, ...innerHash]);
            return sha1Bytes(outerMessage);
        }

        // SHA1
        function sha1Bytes(data) {
            const hash = sha1(data);
            const result = [];
            for (let i = 0; i < hash.length; i += 2) {
                result.push(parseInt(hash.substr(i, 2), 16));
            }
            return result;
        }

        // Инициализируем сетку кодов
        function initializeGrid() {
            const grid = document.getElementById('codesGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= ACCOUNTS; i++) {
                const card = document.createElement('div');
                if (i > 4) {
                    card.className = 'code-card bottom-card';
                } else {
                    card.className = 'code-card';
                }
                card.id = `card-${i}`;
                card.innerHTML = `
                    <div class="account-label">Аккаунт ${i}</div>
                    <div class="code-display" id="code-${i}">------</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-${i}" style="width: 100%"></div>
                    </div>
                    <div class="countdown" id="countdown-${i}">Обновление через 30с</div>
                    <div class="button-container">
                        <button class="btn-copy" id="copy-${i}" data-account="${i}">📋 Копировать</button>
                    </div>
                `;
                grid.appendChild(card);
            }

            // Добавляем обработчики для кнопок копирования
            for (let i = 1; i <= ACCOUNTS; i++) {
                document.getElementById(`copy-${i}`).addEventListener('click', () => copyCode(i));
            }
        }

        // Обновляем все коды
        function updateCodes() {
            const now = Math.floor(Date.now() / 1000);
            const timeInPeriod = now % 30;
            const progress = ((30 - timeInPeriod) / 30) * 100;
            
            for (let i = 1; i <= ACCOUNTS; i++) {
                const secret = SECRETS[i];
                const code = generateTOTP(secret, now);
                
                document.getElementById(`code-${i}`).textContent = code;
                document.getElementById(`progress-${i}`).style.width = progress + '%';
                document.getElementById(`countdown-${i}`).textContent = `Обновление через ${30 - timeInPeriod}с`;
            }
        }

        // Копируем отдельный код
        function copyCode(accountNumber) {
            const code = document.getElementById(`code-${accountNumber}`).textContent;
            if (code === '------') return;

            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById(`copy-${accountNumber}`);
                const originalText = btn.textContent;
                btn.textContent = '✓ Скопировано!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Переносим карточки 5 и 6 в отдельный контейнер
        function reorganizeCards() {
            const grid = document.getElementById('codesGrid');
            const card5 = document.getElementById('card-5');
            const card6 = document.getElementById('card-6');

            if (card5 && card6) {
                const wrapper = document.createElement('div');
                wrapper.className = 'bottom-cards-wrapper';
                
                grid.appendChild(wrapper);
                wrapper.appendChild(card5);
                wrapper.appendChild(card6);
            }
        }

        // Инициализация
        function init() {
            initializeGrid();
            reorganizeCards();
            updateCodes();

            // Обновляем коды каждую секунду
            setInterval(updateCodes, 1000);
        }

        // Запускаем при загрузке страницы
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
