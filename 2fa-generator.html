<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Code Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .codes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .code-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .code-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.1);
        }

        .code-label-section {
            margin-bottom: 15px;
        }

        .label-input {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            width: 100%;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .label-input::placeholder {
            color: #bbb;
        }

        .code-display {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }

        .code-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .timer-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .timer-progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            animation: timer 30s linear infinite;
        }

        @keyframes timer {
            0% {
                width: 100%;
            }
            100% {
                width: 0%;
            }
        }

        .timer-text {
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }

        .btn-delete {
            background: #f56565;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-delete:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-copy-main {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-copy-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(72, 187, 120, 0.4);
        }

        .btn-copy-main.copied {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
        }

        .selected-code-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .selected-code-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .selected-code-value {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
            margin-bottom: 5px;
        }

        .settings {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .settings h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-item label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }

        .setting-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .codes-grid {
                grid-template-columns: 1fr;
            }

            .code-value {
                font-size: 28px;
            }

            .selected-code-value {
                font-size: 36px;
            }

            .btn-copy-main {
                font-size: 16px;
                padding: 15px;
            }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #48bb78;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .code-card.selected {
            border-color: #48bb78;
            background: #f0fdf4;
            box-shadow: 0 8px 25px rgba(72, 187, 120, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 2FA Generator</h1>
            <p>Генератор кодов двухфакторной аутентификации</p>
        </div>

        <div class="controls-section">
            <button class="btn-add" id="addCodeBtn" onclick="addCodeCard()">+ Добавить код</button>
        </div>

        <div id="emptyState" style="display: none;" class="empty-state">
            <p>Нет добавленных кодов</p>
            <p style="font-size: 12px;">Нажмите кнопку "Добавить код" для начала</p>
        </div>

        <div class="codes-grid" id="codesGrid"></div>

        <div id="copySection" style="display: none;">
            <div class="selected-code-display">
                <div class="selected-code-label">Выбранный код</div>
                <div class="selected-code-value" id="selectedCodeValue">000000</div>
            </div>
            <button class="btn-copy-main" id="copyBtn" onclick="copySelectedCode()">📋 КОПИРОВАТЬ КОД</button>
        </div>

        <div class="settings">
            <h3>⚙️ Настройки</h3>
            <div class="setting-item">
                <label for="secretInput">Secret Key (Base32):</label>
                <input type="text" id="secretInput" placeholder="Вставьте secret key от 2FA" value="JBSWY3DPEBLW64TMMQ======">
            </div>
            <div class="setting-item">
                <label for="issuerInput">Издатель:</label>
                <input type="text" id="issuerInput" placeholder="Например: Google, GitHub и т.д." value="Example Service">
            </div>
            <div class="setting-item">
                <label for="accountInput">Аккаунт:</label>
                <input type="text" id="accountInput" placeholder="Например: user@example.com" value="user@example.com">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jssha@3.2.2/dist/sha1.js"></script>
    <script>
        let codes = [];
        let selectedCodeId = null;
        const MAX_CODES = 6;

        class TOTP {
            constructor(secret) {
                this.secret = secret;
            }

            base32Decode(str) {
                const base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
                let bits = '';
                let value = 0;

                for (let i = 0; i < str.length; i++) {
                    const val = base32chars.indexOf(str.charAt(i).toUpperCase());
                    if (val === -1) throw new Error('Invalid base32 character.');
                    bits += val.toString(2).padStart(5, '0');
                }

                const output = new Uint8Array(Math.floor(bits.length / 8));
                for (let i = 0; i < output.length; i++) {
                    value = parseInt(bits.substr(i * 8, 8), 2);
                    output[i] = value;
                }
                return output;
            }

            getCode() {
                const epoch = Math.floor(Date.now() / 1000);
                const timeCounter = Math.floor(epoch / 30);

                const key = this.base32Decode(this.secret);

                const hmac = new jsSHA('SHA-1', 'UINT8ARRAY');
                
                const counter = new ArrayBuffer(8);
                const view = new DataView(counter);
                let tc = timeCounter;
                for (let i = 7; i >= 0; --i) {
                    view.setUint8(i, tc & 0xff);
                    tc >>= 8;
                }

                hmac.setHMACKey(key, 'UINT8ARRAY');
                hmac.update(new Uint8Array(counter));

                const hmacResult = hmac.getHMAC('UINT8ARRAY');
                const offset = hmacResult[hmacResult.length - 1] & 0x0f;

                let otp = (
                    ((hmacResult[offset] & 0x7f) << 24) |
                    ((hmacResult[offset + 1] & 0xff) << 16) |
                    ((hmacResult[offset + 2] & 0xff) << 8) |
                    (hmacResult[offset + 3] & 0xff)
                ) % 1000000;

                return otp.toString().padStart(6, '0');
            }

            getProgress() {
                const epoch = Math.floor(Date.now() / 1000);
                return ((epoch % 30) / 30) * 100;
            }

            getTimeLeft() {
                const epoch = Math.floor(Date.now() / 1000);
                return 30 - (epoch % 30);
            }
        }

        function addCodeCard() {
            if (codes.length >= MAX_CODES) {
                alert(`Максимум ${MAX_CODES} кодов`);
                return;
            }

            const id = Date.now();
            const newCode = {
                id,
                label: `Код ${codes.length + 1}`,
                secret: document.getElementById('secretInput').value
            };
            codes.push(newCode);

            if (selectedCodeId === null) {
                selectedCodeId = id;
            }

            renderCodes();
            updateAddButton();
        }

        function removeCodeCard(id) {
            codes = codes.filter(code => code.id !== id);
            
            if (selectedCodeId === id) {
                selectedCodeId = codes.length > 0 ? codes[0].id : null;
            }

            renderCodes();
            updateAddButton();
        }

        function selectCode(id) {
            selectedCodeId = id;
            renderCodes();
            updateCopySection();
        }

        function updateLabel(id, label) {
            const code = codes.find(c => c.id === id);
            if (code) {
                code.label = label || `Код ${codes.indexOf(code) + 1}`;
            }
        }

        function renderCodes() {
            const grid = document.getElementById('codesGrid');
            const empty = document.getElementById('emptyState');

            if (codes.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                document.getElementById('copySection').style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            document.getElementById('copySection').style.display = 'block';

            grid.innerHTML = codes.map((code, index) => {
                const totp = new TOTP(code.secret);
                const otpCode = totp.getCode();
                const progress = totp.getProgress();
                const isSelected = selectedCodeId === code.id;

                return `
                    <div class="code-card ${isSelected ? 'selected' : ''}" onclick="selectCode(${code.id})" style="cursor: pointer;">
                        <div class="code-label-section">
                            <input 
                                type="text" 
                                class="label-input" 
                                placeholder="Название"
                                value="${code.label}"
                                onchange="updateLabel(${code.id}, this.value)"
                                onclick="event.stopPropagation();"
                            >
                        </div>
                        <div class="code-display">
                            <div class="code-value">${otpCode}</div>
                            <div class="timer-bar">
                                <div class="timer-progress" style="animation: none; width: ${progress}%"></div>
                            </div>
                            <div class="timer-text">обновится через ${totp.getTimeLeft()}с</div>
                        </div>
                        <button class="btn-delete" onclick="event.stopPropagation(); removeCodeCard(${code.id})">🗑️ Удалить</button>
                    </div>
                `;
            }).join('');

            updateCopySection();
        }

        function updateCopySection() {
            if (selectedCodeId === null || codes.length === 0) return;

            const selectedCode = codes.find(c => c.id === selectedCodeId);
            if (!selectedCode) return;

            const totp = new TOTP(selectedCode.secret);
            const otpCode = totp.getCode();
            
            document.getElementById('selectedCodeValue').textContent = otpCode;
        }

        function copySelectedCode() {
            if (selectedCodeId === null) return;

            const selectedCode = codes.find(c => c.id === selectedCodeId);
            if (!selectedCode) return;

            const totp = new TOTP(selectedCode.secret);
            const otpCode = totp.getCode();

            navigator.clipboard.writeText(otpCode).then(() => {
                const btn = document.getElementById('copyBtn');
                const original = btn.textContent;
                btn.textContent = '✓ КОД СКОПИРОВАН!';
                btn.classList.add('copied');

                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);

                showToast('Код скопирован в буфер обмена');
            });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function updateAddButton() {
            const btn = document.getElementById('addCodeBtn');
            btn.disabled = codes.length >= MAX_CODES;
        }

        function updateCodes() {
            if (codes.length > 0) {
                renderCodes();
            }
            setTimeout(updateCodes, 1000);
        }

        // Инициализация
        addCodeCard();
        updateCodes();
    </script>
</body>
</html>
